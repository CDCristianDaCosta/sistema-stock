{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            📦 Nueva Compra
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Proveedor</label>
                <select
                name="proveedor"
                class="form-control"
                required>

                    <option value="">
                        Seleccionar proveedor
                    </option>

                    {% for pr in proveedores %}
                    <option value="{{ pr.id }}">
                        {{ pr.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Producto</label>

                <select
                name="producto"
                class="form-control"
                required>

                    <option value="">
                        Seleccionar producto
                    </option>

                    {% for p in productos %}
                    <option value="{{ p.id }}">
                        {{ p.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Cantidad</label>
                <input
                type="number"
                name="cantidad"
                class="form-control"
                required>
            </div>

            <div class="mb-3">
                <label>Precio de compra</label>

                <input
                type="number"
                name="precio"
                class="form-control"
                required>
            </div>

            <button class="btn btn-success w-100">
                Guardar Compra
            </button>

        </form>

    </div>

</div>

{% endblock %}
