<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f4f6f9;
            overflow-x:hidden;
        }

        /* SIDEBAR */
        .sidebar{
            position:fixed;
            left:0;
            top:0;
            width:260px;
            height:100vh;
            background:#111827;
            color:white;
            padding:20px;
            overflow-y:auto;
            transition:.3s;
            z-index:999;
        }

        .logo{
            font-size:30px;
            font-weight:bold;
            margin-bottom:30px;
            text-align:center;
        }

        .menu-title{
            color:#9ca3af;
            font-size:13px;
            text-transform:uppercase;
            margin-top:25px;
            margin-bottom:10px;
            letter-spacing:1px;
        }

        .sidebar a{
            display:flex;
            align-items:center;
            gap:12px;
            color:#fff;
            text-decoration:none;
            padding:14px 16px;
            margin-bottom:8px;
            border-radius:12px;
            transition:.2s;
            font-size:16px;
        }

        .sidebar a:hover{
            background:#2563eb;
            transform:translateX(4px);
        }

        .sidebar a i{
            width:22px;
        }

        /* CONTENIDO */
        .content{
            margin-left:260px;
            padding:30px;
            min-height:100vh;
        }

        /* BOTON MENU MOBILE */
        .mobile-toggle{
            display:none;
            position:fixed;
            top:15px;
            left:15px;
            z-index:1000;
            background:#2563eb;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:10px;
            font-size:20px;
        }

        /* IMAGEN PRODUCTOS */
        img{
            transition:0.3s;
            border-radius:10px;
        }

        img:hover{
            transform:scale(1.08);
        }

        /* RESPONSIVE */
        @media(max-width:992px){

            .sidebar{
                left:-260px;
            }

            .sidebar.active{
                left:0;
            }

            .content{
                margin-left:0;
                padding:70px 15px 20px;
            }

            .mobile-toggle{
                display:block;
            }
        }

    </style>
</head>

<body>

<button class="mobile-toggle" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
</button>

<!-- MENU -->
<div class="sidebar" id="sidebar">

    <div class="logo">
        💼 Sistema
    </div>

    <div class="menu-title">
        Principal
    </div>

    <a href="/dashboard/">
        <i class="fas fa-home"></i> Inicio
    </a>

    <a href="/productos/">
        <i class="fas fa-box"></i> Productos
    </a>

    <a href="/ventas/">
        <i class="fas fa-cash-register"></i> Ventas
    </a>

    <a href="/productos/clientes/">
        <i class="fas fa-users"></i> Clientes
    </a>

    <a href="/productos/proveedores/">
        <i class="fas fa-truck"></i> Proveedores
    </a>

    <a href="/productos/compras/">
        <i class="fas fa-cart-shopping"></i> Compras
    </a>

    <div class="menu-title">
        Reportes
    </div>

    <a href="/ventas/reporte/">
        <i class="fas fa-chart-bar"></i> Reportes
    </a>

    <a href="/ventas/grafico/">
        <i class="fas fa-chart-line"></i> Estadísticas
    </a>

    <div class="menu-title">
        Caja
    </div>

    <a href="/ventas/caja/abrir/">
        <i class="fas fa-lock-open"></i> Abrir Caja
    </a>

    <a href="/ventas/caja/cerrar/">
        <i class="fas fa-lock"></i> Cerrar Caja
    </a>

    <hr style="border-color:#374151;">

    <a href="/admin/logout/">
        <i class="fas fa-right-from-bracket"></i> Cerrar sesión
    </a>

</div>

<!-- CONTENIDO -->
<div class="content">
    {% block content %}
    {% endblock %}
</div>

<script>

function toggleSidebar(){
    document.getElementById("sidebar")
    .classList.toggle("active");
}

</script>

</body>
</html>
