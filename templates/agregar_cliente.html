{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            👤 Nuevo Cliente
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Nombre</label>

                <input
                type="text"
                name="nombre"
                class="form-control"
                required>
            </div>

            <div class="mb-3">
                <label>Documento</label>

                <input
                type="text"
                name="documento"
                class="form-control">
            </div>

            <button class="btn btn-success w-100">
                Guardar Cliente
            </button>

        </form>

    </div>

</div>

{% endblock %}
