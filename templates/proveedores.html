{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h2>Proveedores</h2>
        <a href="/productos/proveedores/agregar/" class="btn btn-success">+ Nuevo</a>
    </div>

    <div class="card shadow mt-3">
        <table class="table table-striped">

            <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>

            {% for p in proveedores %}
            <tr>
                <td>{{ p.nombre }}</td>
                <td>{{ p.telefono }}</td>
                <td>{{ p.direccion }}</td>
                <td>

                    <a
                        href="/productos/proveedores/editar/{{ p.id }}/"
                        class="btn btn-warning btn-sm"
                    >
                        ✏ Editar
                    </a>
                
                    <a
                        href="/productos/proveedores/eliminar/{{ p.id }}/"
                        class="btn btn-danger btn-sm"
                    >
                        🗑 Eliminar
                    </a>
                
                </td>
            </tr>
            {% endfor %}

        </table>
    </div>

</div>

{% endblock %}
