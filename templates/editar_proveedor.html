{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow border-0 rounded-4 p-4">

        <h2 class="mb-4 fw-bold">
            ✏ Editar Proveedor
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Nombre
                </label>

                <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    value="{{ proveedor.nombre }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Teléfono
                </label>

                <input
                    type="text"
                    name="telefono"
                    class="form-control"
                    value="{{ proveedor.telefono }}"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Dirección
                </label>

                <input
                    type="text"
                    name="direccion"
                    class="form-control"
                    value="{{ proveedor.direccion }}"
                >
            </div>

            <button class="btn btn-success">
                💾 Guardar cambios
            </button>

            <a
                href="/productos/proveedores/"
                class="btn btn-secondary"
            >
                Cancelar
            </a>

        </form>

    </div>

</div>

{% endblock %}
