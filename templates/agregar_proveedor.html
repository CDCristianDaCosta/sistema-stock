{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="card shadow p-4">

        <h2 class="mb-4">
            🏭 Nuevo Proveedor
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label>Nombre</label>

                <input
                type="text"
                name="nombre"
                class="form-control"
                required>
            </div>

            <div class="mb-3">
                <label>Teléfono</label>

                <input
                type="text"
                name="telefono"
                class="form-control">
            </div>

            <div class="mb-3">
                <label>Dirección</label>

                <input
                type="text"
                name="direccion"
                class="form-control">
            </div>

            <button class="btn btn-success w-100">
                Guardar Proveedor
            </button>

        </form>

    </div>

</div>

{% endblock %}
